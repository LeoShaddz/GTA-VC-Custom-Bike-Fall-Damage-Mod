; BikeFallDamageVC - GTA Vice City PC v1.0  (NOT COMPILED, NOT TESTED)
; Reloaded automatically when the file is saved.
; Chooses how much health and armor the player loses when he falls off a motorbike.
[Settings]
Enabled=1

; 1 = writes the log file (BikeFallDamageVC.log, in the game folder) to diagnose problems. 0 = no log.
; With the log on, it also records the player's health every 100 ms for a few seconds after being knocked off a bike.
EnableLog=0

; Total points lost when the player falls off a bike. As in the game, the armor absorbs it first and what is left goes to the
; health (with no armor, all of it goes to the health). The game's maximum health is 150. 0 = no damage from the fall.
FallDamage=2

; 1 = a bike fall never removes armor: all of FallDamage goes to the health. 0 = the armor absorbs it first (see above).
NoArmorDamage=0

; 1 = the value above is used only for the landing that follows being knocked off a bike (other falls stay as in the game).
; 0 = the value above is used for EVERY hard landing of the player (jumping from buildings, etc.).
OnlyAfterBikeFall=1

; How long (in milliseconds of game time) one bike fall lasts: after the fall damage is applied, other damage calls of the same
; fall are skipped for this long (so the total is FallDamage), and a landing this soon after being knocked off counts as "the bike fall".
BikeFallWindowMs=5000
